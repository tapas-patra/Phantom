name: Phantom CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phantom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phantom-website-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: phantom-website-dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - phantom-windows-app-backend/Phantom.WindowsApp.Backend.csproj
          - phantom-dashboard-backend/Phantom.Dashboard.Backend.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore "${{ matrix.project }}"
      - run: dotnet build "${{ matrix.project }}" --configuration Release --no-restore
