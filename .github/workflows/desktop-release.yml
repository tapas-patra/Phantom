name: Desktop release

on:
  push:
    branches: [main]
    paths:
      - "phantom-windows-app/**"
      - "phantom-mac-app/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

env:
  RELEASE_REPOSITORY: tapas-patra/phantom-release-repo
  RELEASE_TAG: desktop-latest

# Do not use actions/upload-artifact for these zips. Actions artifact storage is
# quota-limited (and is what fails with "Artifact storage quota has been hit").
# GitHub Release assets are a different store: 2 GiB per file, no total size or
# bandwidth cap. Each job uploads its zip with gh, which is the same Releases
# API as softprops/action-gh-release.

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure rolling GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.PHANTOM_RELEASE_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
              --title "Phantom Desktop (latest)" \
              --notes "Automated unsigned desktop build from $GITHUB_SHA."

  windows:
    needs: [prepare-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build standalone Windows app
        shell: pwsh
        run: >-
          dotnet publish phantom-windows-app/SecureOverlay.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o release/windows
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path release/windows/* -DestinationPath Phantom-Windows-x64.zip
      - name: Upload Windows zip to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PHANTOM_RELEASE_TOKEN }}
        run: gh release upload "$RELEASE_TAG" Phantom-Windows-x64.zip --repo "$RELEASE_REPOSITORY" --clobber

  macos:
    needs: [prepare-release]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: ./phantom-mac-app/Scripts/build-app.sh
      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent phantom-mac-app/dist/Phantom.app Phantom-macOS.zip
      - name: Upload macOS zip to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.PHANTOM_RELEASE_TOKEN }}
        run: gh release upload "$RELEASE_TAG" Phantom-macOS.zip --repo "$RELEASE_REPOSITORY" --clobber

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Stamp release notes
        env:
          GH_TOKEN: ${{ secrets.PHANTOM_RELEASE_TOKEN }}
        run: >
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY"
          --notes "Automated unsigned desktop build from $GITHUB_SHA."
