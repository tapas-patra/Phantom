name: Render Keepalive

on:
  schedule:
    - cron: "*/10 3-14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - https://phantom-ai-windows-app-backend.onrender.com/health
          - https://phantom-dashboard-backend.onrender.com/health
    steps:
      - name: Ping service
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            "${{ matrix.target }}" > /dev/null
